# 云上牧场 — 生产站点配置
# 放到 /etc/nginx/conf.d/smart-farming.conf，改完 `nginx -t && systemctl reload nginx`
#
# 三个前提必须同时成立，缺任何一个上线当天就是白屏或"推送时断时续"：
#   1. 后端只监听 127.0.0.1:8000（config.py 的 AI_HOST 默认值就是它，不要改成 0.0.0.0，
#      否则等于绕过本文件把所有防护和限流架空）。
#   2. /api 与 /api/ws 都由这里同源转发——前端产物里不含任何 host:port，基址是运行时从
#      location 推断的（api/client.ts），所以这一层就是它与后端之间唯一的桥。
#   3. SSE 与 WebSocket 必须关缓冲并拉长读超时，否则问诊首帧会被攒到整轮结束才吐出。

upstream sf_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;                      # ← 换成你的域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;                      # ← 同上
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;   # ← 换
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;     # ← 换

    # 与后端 kb.py 的 20MB 附件上限对齐；nginx 默认 1m 会先一步返回 413，
    # 用户看到的是"上传失败"而不是后端给出的真实大小提示
    client_max_body_size 20m;

    root /srv/smart-farming/dist;       # ← 前端 `npm run build` 产物
    index index.html;

    # 运维探针：只允许本机访问。它不含凭据但会暴露 state_backend/checkpoint 等
    # 内部实现细节，没必要给公网扫描器读
    location = /api/health {
        proxy_pass http://sf_api;
        allow 127.0.0.1;
        deny all;
    }

    # 告警通道（WebSocket）。必须排在 /api/ 之前语义上更清楚，虽然 nginx 按最长前缀
    # 匹配已经会选中它。Upgrade 头不显式打开就是握手 400。
    location /api/ws/ {
        proxy_pass http://sf_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # 长连接：默认 60s 会被掐，前端退避重连表现为推送断续
    }

    location /api/ {
        proxy_pass http://sf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端 ratelimit.client_ip() 读的就是这个头。不配它，全平台所有农户会被算成
        # 同一个来源 IP，登录/注册/设备上行那三道按 IP 的闸会互相牵连
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # SSE：问诊是逐帧推的，缓冲会毁掉整个流式体验
        proxy_cache off;
        proxy_read_timeout 300s;    # 一轮问诊含视觉与 RAG 可超过默认 60s
        proxy_send_timeout 300s;
    }

    # 带 hash 的构建产物可长缓存；index.html 绝不能缓存，否则发版不生效
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA history 路由：深链和刷新必须回落 index.html，否则 /dashboard 直接 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 大字段导出（台账 CSV）不必进访问日志
    access_log /var/log/nginx/smart-farming.access.log;
}
