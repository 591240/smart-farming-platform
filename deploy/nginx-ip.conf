# 云上牧场 — 生产站点配置（IP 直访版，无域名/无 SSL）
# 放到 /etc/nginx/conf.d/smart-farming.conf，改完 `nginx -t && systemctl reload nginx`
# 切域名时：server_name 换域名、补 listen 443 ssl + 证书、80 加 301 跳转

upstream sf_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name 43.142.92.229;

    # 与后端 kb.py 的 20MB 附件上限对齐；nginx 默认 1m 会先一步返回 413
    client_max_body_size 20m;

    # JS/CSS/JSON 传输压缩：默认 gzip_types 只压 html，JS 裸奔导致大 chunk 首次点击慢
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    root /srv/smart-farming/dist;
    index index.html;

    # 运维探针：只允许本机访问。它不含凭据但会暴露 state_backend/checkpoint 等内部细节
    location = /api/health {
        proxy_pass http://sf_api;
        allow 127.0.0.1;
        deny all;
    }

    # 告警通道（WebSocket）。Upgrade 头不显式打开就是握手 400
    location /api/ws/ {
        proxy_pass http://sf_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Prometheus 应用指标（监控平台公网抓取）。精确匹配优先于 /api/ 与 /
    # 只暴露端点计数/延迟分位数，无业务数据
    location = /metrics {
        proxy_pass http://sf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://sf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端 ratelimit.client_ip() 读的就是这个头；缺了全平台会被算成同一来源 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # SSE：问诊逐帧推，缓冲会毁掉流式体验
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 带 hash 的构建产物可长缓存；index.html 绝不能缓存，否则发版不生效
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 入口页显式禁缓存：浏览器每次都拿最新 index.html，发版即刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA history 路由：深链和刷新必须回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/smart-farming.access.log;
}
